name: Deploy PR Preview

# This workflow deploys PR previews to Netlify to avoid conflicts with the main site.
# Each PR gets its own preview URL on Netlify with automatic cleanup.
# Netlify is widely adopted, actively maintained, and has excellent preview support.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Required permissions to comment on PRs
permissions:
  pull-requests: write  # To comment on PR

# Netlify site API ID (public identifier – not sensitive)
env:
  NETLIFY_SITE_ID: b41210aa-495b-4238-bf63-0c7e938f63fd

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    
    steps:
      # Step 0: Check if Netlify auth token secret is configured
      - name: Check Netlify auth token
        id: netlify-auth
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is not configured. Skipping Netlify preview deploy."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Netlify auth token is configured"
            echo "Using site ID: ${NETLIFY_SITE_ID}"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      
      # Step 1: Checkout the PR branch
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Ruby environment
      # Installs Ruby and sets up bundler with automatic gem caching
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Step 3: Cache generated images
      # Jekyll Picture Tag generates optimized images in the '_site/generated/' directory
      # Cache this directory to avoid regenerating images on every build
      - name: Cache generated images
        uses: actions/cache@v4
        with:
          path: _site/generated/
          key: ${{ runner.os }}-generated-images-${{ hashFiles('assets/img/**', '_data/picture.yml') }}
          restore-keys: |
            ${{ runner.os }}-generated-images-

      # Step 4: Install system dependencies required by jekyll_picture_tag
      # The jekyll_picture_tag plugin requires libvips and related libraries for image processing
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-tools \
            libvips-dev \
            liblcms2-dev \
            libopenjp2-7-dev \
            libpng-dev \
            libwebp-dev \
            libheif-dev \
            imagemagick \
            libjxl-dev \
            libpoppler-glib-dev

      # Step 5: Build Jekyll site for PR preview
      # Build without baseurl since Netlify serves from root
      - name: Build Jekyll site for PR preview
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Step 6: Deploy to Netlify
      # Uses the official Netlify CLI to deploy
      # Each PR gets a unique deploy preview URL
      - name: Deploy to Netlify
        id: netlify
        if: steps.netlify-auth.outputs.has_token == 'true'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_site'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from PR #${{ github.event.pull_request.number }}"
          alias: pr-${{ github.event.pull_request.number }}
          netlify-config-path: ./netlify.toml
          enable-github-deployment: false
          enable-commit-status: false
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        timeout-minutes: 5
        continue-on-error: true

      # Step 7: Comment on PR with preview URL
      # Creates or updates a comment with the preview link
      - name: Comment on PR with preview URL
        if: steps.netlify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const deployUrl = `${{ steps.netlify.outputs.deploy-url }}`;
            const previewUrl = deployUrl || 'URL not available';
            
            console.log('Deploy URL from Netlify:', deployUrl);
            console.log('Preview URL:', previewUrl);
            
            if (!deployUrl) {
              console.log('Warning: Deploy URL is empty!');
            }
            
            const body = `🚀 **Preview deployment ready!**\n\nView your changes at: ${previewUrl}\n\n✨ Powered by Netlify - auto-updates on every commit and auto-deletes when PR is closed.`;
            
            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview deployment')
            );
            
            if (botComment) {
              // Update existing comment
              console.log('Updating existing comment:', botComment.id);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              console.log('Creating new comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
            
            console.log('Comment posted successfully!');
      
      # Step 8: Comment only when preview deploy is skipped because the secret is missing.
      - name: Comment on preview deploy skip
        if: steps.netlify-auth.outputs.has_token != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            let body = `ℹ️ **Preview deployment skipped**\n\n`;
            body += `**Issue**: \`NETLIFY_AUTH_TOKEN\` secret is missing.\n\n`;
            body += `**To fix**:\n`;
            body += `1. Generate a Personal Access Token in Netlify User settings > Applications\n`;
            body += `2. Add it as \`NETLIFY_AUTH_TOKEN\` in repository Settings > Secrets and variables > Actions\n\n`;
            body += `See [setup instructions](.github/workflows/README.md) for details.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
