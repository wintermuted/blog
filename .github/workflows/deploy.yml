name: Deploy Jekyll site to Netlify

# This workflow builds the Jekyll site with all required gems and plugins,
# then deploys the generated static site to the production Netlify site that
# serves jnyeholt.dev and www.jnyeholt.dev.

on:
  push:
    branches:
      - master  # Only trigger on pushes to master branch, not for every branch
    # Optionally, you can also add other branches like 'main' if needed:
    # - main

# Netlify site API ID (public identifier – not sensitive)
env:
  NETLIFY_SITE_ID: b41210aa-495b-4238-bf63-0c7e938f63fd

# Minimal permissions for checkout + deployment status integration
permissions:
  contents: read

# Allow only one concurrent production deployment at a time.
concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository
      # This fetches the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      # Step 2: Set up Ruby environment
      # Installs Ruby and sets up bundler with automatic gem caching
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'  # Specify Ruby version (no .ruby-version file in repo)
          bundler-cache: true  # Automatically runs 'bundle install' and caches gems

      # Step 3: Cache generated images
      # Jekyll Picture Tag generates optimized images in the '_site/generated/' directory
      # Cache this directory to avoid regenerating images on every build
      - name: Cache generated images
        uses: actions/cache@v4
        with:
          path: _site/generated/
          key: ${{ runner.os }}-generated-images-${{ hashFiles('assets/img/**', '_data/picture.yml') }}
          restore-keys: |
            ${{ runner.os }}-generated-images-

      # Step 4: Install system dependencies required by jekyll_picture_tag
      # The jekyll_picture_tag plugin requires libvips and related libraries for image processing
      # These are Ubuntu/Debian package names (the existing workflow uses Arch Linux/pacman)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-tools \
            libvips-dev \
            liblcms2-dev \
            libopenjp2-7-dev \
            libpng-dev \
            libwebp-dev \
            libheif-dev \
            imagemagick \
            libjxl-dev \
            libpoppler-glib-dev

      # Step 5: Build the Jekyll site
      # Generates the static site in the _site directory
      # No baseurl override needed - site uses custom domain (jnyeholt.dev) served from root
      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production  # Set environment to production for optimizations

      # Step 6: Verify production Netlify credentials
      - name: Check Netlify auth token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not configured."
            echo "::error::Production deploys target Netlify because jnyeholt.dev resolves there."
            exit 1
          fi

      # Step 7: Deploy the built site to the live Netlify site
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_site'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy Jekyll site'
          netlify-config-path: ./netlify.toml
          enable-github-deployment: false
          enable-commit-status: false
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
