<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- CSS — @wintermuted/ui-theme (vendored v0.18.0) -->

  <link rel="stylesheet" href="{{ "/css/wm-theme/tokens.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/base.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/card.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/badge.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/side-nav.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/tag.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/list.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/separator.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/code-block.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/wm-theme/components/gallery.css" | prepend: site.baseurl }}">

  <!-- Lightbox2 for image galleries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">

  <!-- CSS — site styles -->

  <link rel="stylesheet" href="{{ "/css/styles.css" | prepend: site.baseurl }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <!-- Lightbox2 JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/lightbox.min.js"></script>
</head>
