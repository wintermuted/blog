{% assign current = page.url | downcase | split: '/' %}

<header class="site-header docs-topbar">
  {% if page.url == '/' %}
    <div class="docs-topbar-inner docs-topbar-inner--home">
      <div class="docs-topbar-actions docs-topbar-actions--home"></div>
    </div>
  {% else %}
    <div class="docs-topbar-inner">
      <div class="docs-topbar-brand">
        <a href="{{ site.baseurl }}/" class="docs-topbar-brand-link">
          <img src="{{ site.baseurl }}/logo.png" alt="" class="docs-topbar-brand-icon" width="20" height="20">
          <h1>jnyeholt</h1>
        </a>
      </div>
      <button type="button" class="docs-topbar-scroll-title" aria-label="Scroll to top">
        <span class="docs-topbar-scroll-title-icon"></span>
        <span class="docs-topbar-scroll-title-text"></span>
      </button>
      <nav class="docs-topbar-nav" aria-label="Main navigation">
        <a class="docs-topbar-link-devdocs" href="{{ site.baseurl }}/projects"
          {% if current[1] == 'projects' %}aria-current="page"{% endif %}>Projects</a>
        <a class="docs-topbar-link-devdocs" href="{{ site.baseurl }}/weblog"
          {% if current[1] == 'weblog' %}aria-current="page"{% endif %}>Weblog</a>
        <a class="docs-topbar-link-devdocs" href="{{ site.baseurl }}/about"
          {% if current[1] == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
      <div class="docs-topbar-actions">
        <a class="docs-topbar-link-secondary" href="https://www.linkedin.com/in/jwnyeholt" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
        <a class="docs-topbar-link-secondary" href="https://github.com/wintermuted" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
      </div>
    </div>
  {% endif %}
</header>
