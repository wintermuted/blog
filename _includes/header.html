{% assign current = page.url | downcase | split: '/' %}

<header class="site-header">
  <div class="container">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav-brand" href="{{ site.baseurl }}/">
        <img src="{{ site.baseurl }}/logo.png" alt="" width="30" height="30">
        jnyeholt
      </a>
      <ul class="site-nav-links">
        <li>
          <a href="{{ site.baseurl }}/about"
            {% if current[1] == 'about' %}aria-current="page"{% endif %}>About</a>
        </li>
        <li>
          <a href="{{ site.baseurl }}/weblog"
            {% if current[1] == 'weblog' %}aria-current="page"{% endif %}>Weblog</a>
        </li>
        <li>
          <a href="{{ site.baseurl }}/resume" target="_blank">CV</a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/jwnyeholt" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
        </li>
        <li>
          <a href="https://github.com/wintermuted" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
