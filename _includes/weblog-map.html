<div class="weblog-layout" id="weblog-map">
  <div class="weblog-layout-content">
    <div class="row">
      <div class="col-md-9 col-sm-12">
        {% include weblog-nav.html %}
        {% assign posts = site.posts | where_exp:"post", "post.category != 'changelog' and post.location" %}

        <section class="weblog-map-panel" aria-label="Post location map">
          <div id="weblog-location-map" class="weblog-map-canvas"></div>
          <p class="weblog-map-note text-muted">
            Map pins are generated from post location metadata and a curated location coordinate list.
          </p>
        </section>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script>
          (function () {
            const mapElement = document.getElementById('weblog-location-map');
            if (!mapElement || typeof L === 'undefined') {
              return;
            }

            const mapPosts = [
              {% for post in posts %}
              {
                title: {{ post.title | jsonify }},
                url: {{ post.url | prepend: site.baseurl | jsonify }},
                location: {{ post.location | jsonify }},
                date: {{ post.date | date: "%-d %b, %Y" | jsonify }},
                category: {{ post.category | jsonify }}
              }{% unless forloop.last %},{% endunless %}
              {% endfor %}
            ];

            const groupedByLocation = {};
            mapPosts.forEach((post) => {
              if (!groupedByLocation[post.location]) {
                groupedByLocation[post.location] = [];
              }
              groupedByLocation[post.location].push(post);
            });

            const locationCoordinates = {
              {% for entry in site.data.weblog_location_coordinates %}
              {{ entry.name | jsonify }}: { lat: {{ entry.lat }}, lon: {{ entry.lon }} }{% unless forloop.last %},{% endunless %}
              {% endfor %}
            };

            const map = L.map(mapElement, {
              zoomControl: true,
              scrollWheelZoom: true
            }).setView([39.5, -98.35], 3);

            const lightTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 18,
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            });

            const darkTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
              maxZoom: 19,
              subdomains: 'abcd',
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            let activeTileLayer = null;
            function isDarkMode() {
              return document.body.getAttribute('data-theme') === 'dark';
            }

            function applyMapTheme() {
              const targetLayer = isDarkMode() ? darkTileLayer : lightTileLayer;
              if (activeTileLayer === targetLayer) {
                return;
              }

              if (activeTileLayer) {
                map.removeLayer(activeTileLayer);
              }

              targetLayer.addTo(map);
              activeTileLayer = targetLayer;
            }

            function markerStyle() {
              if (isDarkMode()) {
                return {
                  radius: 7,
                  color: '#d8d8d8',
                  weight: 2,
                  fillColor: '#9f9f9f',
                  fillOpacity: 0.9
                };
              }

              return {
                radius: 7,
                color: '#5f5f5f',
                weight: 2,
                fillColor: '#9a9a9a',
                fillOpacity: 0.9
              };
            }

            const mapMarkers = [];

            const markerBounds = [];
            function escapeHtml(value) {
              return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
            }

            function popupHtml(locationName, postsAtLocation) {
              const rows = postsAtLocation
                .map((post) => {
                  return '<li><a href="' + escapeHtml(post.url) + '">' + escapeHtml(post.title) + '</a><span class="weblog-map-popup-date"> (' + escapeHtml(post.date) + ')</span></li>';
                })
                .join('');

              return '<div class="weblog-map-popup">'
                + '<h4>' + escapeHtml(locationName) + '</h4>'
                + '<ul>' + rows + '</ul>'
                + '</div>';
            }

            function renderMarkers() {
              const locations = Object.keys(groupedByLocation);
              for (const locationName of locations) {
                try {
                  const coords = locationCoordinates[locationName];
                  if (!coords || Number.isNaN(coords.lat) || Number.isNaN(coords.lon)) {
                    continue;
                  }

                  const marker = L.circleMarker([coords.lat, coords.lon], markerStyle()).addTo(map);
                  marker.bindPopup(popupHtml(locationName, groupedByLocation[locationName]));
                  markerBounds.push([coords.lat, coords.lon]);
                  mapMarkers.push(marker);
                } catch (_e) {
                  // Ignore individual marker failures so the rest of the map can render.
                }
              }

              if (markerBounds.length > 0) {
                map.fitBounds(markerBounds, { padding: [24, 24], maxZoom: 6 });
              }
            }

            renderMarkers();

            function syncMarkerTheme() {
              const style = markerStyle();
              mapMarkers.forEach((marker) => marker.setStyle(style));
            }

            function applyThemeToMap() {
              applyMapTheme();
              syncMarkerTheme();
            }

            applyThemeToMap();

            const darkSwitch = document.getElementById('darkSwitch');
            if (darkSwitch) {
              darkSwitch.addEventListener('change', function () {
                // dark-mode.js applies body[data-theme] right after this event.
                setTimeout(applyThemeToMap, 0);
              });
            }

            const bodyThemeObserver = new MutationObserver(applyThemeToMap);
            bodyThemeObserver.observe(document.body, {
              attributes: true,
              attributeFilter: ['data-theme']
            });
          })();
        </script>
      </div>

      <div class="col-md-3 col-sm-12">
        {% include sidebar.html %}
      </div>
    </div>
  </div>
</div>
