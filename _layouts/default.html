<!DOCTYPE html>
<html>
    {% include head.html %}
    <body class="{% if page.url == '/' %}is-homepage{% endif %}">
                {% if page.url == '/' %}
                <style>
                    body.is-homepage .homepage .homepage-hero--image { min-height: 100svh !important; }
                    body.is-homepage.bg-tone-neutral:not([data-theme="dark"]) .homepage .homepage-hero {
                        background-image: none !important;
                        background-color: #ffffff !important;
                        animation: none !important;
                    }
                    body.is-homepage.bg-tone-neutral:not([data-theme="dark"]) .homepage .homepage-hero-copy {
                        text-shadow: none !important;
                    }
                    body.is-homepage.bg-tone-neutral[data-theme="dark"] .homepage .homepage-hero {
                        background-image: linear-gradient(140deg, #1a1a1a, #060606) !important;
                        background-color: #0b0b0b !important;
                        animation: none !important;
                    }
                    body.is-homepage .site-footer-nav,
                    body.is-homepage .site-footer-nav .text-muted,
                    body.is-homepage .site-footer-nav small {
                        color: rgba(244, 246, 248, 0.88) !important;
                    }

                    body.is-homepage .site-footer-nav a {
                        color: rgba(255, 255, 255, 0.98) !important;
                        font-weight: 600;
                        text-decoration: none;
                    }

                    body.is-homepage .site-footer-nav a:hover {
                        color: #ffffff !important;
                        text-decoration: underline;
                        text-decoration-color: rgba(255, 255, 255, 0.92);
                        text-underline-offset: 0.14em;
                        text-decoration-thickness: 0.09em;
                    }
                </style>
                {% endif %}
        {% include header.html %}
        {{ content }}
        {% include footer.html %}
    </body>
</html>
