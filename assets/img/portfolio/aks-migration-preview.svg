<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">AKS migration workflow</title>
  <desc id="description">Application configuration moves through an assisted workflow, artifact checks, and engineer review to deployment gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#52788b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#20313b}.node{fill:#fff;stroke:#b9c9d1;stroke-width:2}.accent{fill:#dcecf2;stroke:#82a8b8}.line{stroke:#52788b;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font-size:17px;font-weight:600;text-anchor:middle}</style>
  </defs>
  <rect width="640" height="360" rx="14" fill="#edf2f4"/>
  <path class="line" d="M128 180H144M248 180H264M368 180H384M488 180H504"/>
  <rect class="node" x="16" y="126" width="112" height="108" rx="10"/>
  <text class="label" x="72" y="166"><tspan x="72">Application</tspan><tspan x="72" dy="23">configuration</tspan></text>
  <rect class="accent" x="144" y="126" width="104" height="108" rx="10"/>
  <text class="label" x="196" y="166"><tspan x="196">Assisted</tspan><tspan x="196" dy="23">workflow</tspan></text>
  <rect class="node" x="264" y="126" width="104" height="108" rx="10"/>
  <text class="label" x="316" y="166"><tspan x="316">Migration</tspan><tspan x="316" dy="23">artifacts</tspan></text>
  <rect class="accent" x="384" y="126" width="104" height="108" rx="10"/>
  <text class="label" x="436" y="153"><tspan x="436">Checks +</tspan><tspan x="436" dy="22">engineer</tspan><tspan x="436" dy="22">review</tspan></text>
  <rect class="node" x="504" y="126" width="120" height="108" rx="10"/>
  <text class="label" x="564" y="166"><tspan x="564">Deployment</tspan><tspan x="564" dy="23">gates</tspan></text>
</svg>
