<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Unified reporting experience</title>
  <desc id="description">A report author configures a report, fetches data, explores visual results, and drills into details before adjusting the report.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#52788b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#20313b}.node{fill:#fff;stroke:#b9c9d1;stroke-width:2}.accent{fill:#dcecf2;stroke:#82a8b8}.line{stroke:#52788b;stroke-width:3;fill:none;marker-end:url(#arrow)}.return{stroke:#5f8c79;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font-size:17px;font-weight:600;text-anchor:middle}</style>
  </defs>
  <rect width="640" height="360" rx="14" fill="#edf2f4"/>
  <path class="line" d="M168 150H190M326 150H348M484 150H506"/>
  <path class="return" d="M566 206V276H100V214"/>
  <rect class="node" x="32" y="102" width="136" height="96" rx="10"/>
  <text class="label" x="100" y="144"><tspan x="100">Configure</tspan><tspan x="100" dy="23">report</tspan></text>
  <rect class="accent" x="190" y="102" width="136" height="96" rx="10"/>
  <text class="label" x="258" y="144"><tspan x="258">Fetch</tspan><tspan x="258" dy="23">data</tspan></text>
  <rect class="node" x="348" y="102" width="136" height="96" rx="10"/>
  <text class="label" x="416" y="144"><tspan x="416">Visual</tspan><tspan x="416" dy="23">results</tspan></text>
  <rect class="accent" x="506" y="102" width="104" height="96" rx="10"/>
  <text class="label" x="558" y="133"><tspan x="558">Drill-down</tspan><tspan x="558" dy="23">exploration</tspan></text>
</svg>
